[package]
name = "nyx-platform"
version = "0.1.0"
description = "Desktop jobs (Wi-Fi band, DNS, speed test, Taildrop, …) the same way on NyxOS and Omarchy"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"], optional = true }

[features]
# Without `cli`: which command does a job here (what apps need). `cli` adds the
# `nyx-platform` command, NyxOS's implementation of the jobs.
default = []
cli = ["dep:zbus"]

[[bin]]
name = "nyx-platform"
path = "src/bin/nyx-platform.rs"
required-features = ["cli"]
