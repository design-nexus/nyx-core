[package]
name = "nyx-devices"
version = "0.1.0"
description = "Remembered devices: which monitors, audio devices, input devices, Bluetooth devices, drives and linked phones have saved preferences, by an identity that follows the device"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
# Only to check that monitor ids are nyx-desktop's stable_id.
nyx-desktop = { path = "../nyx-desktop", default-features = false }
