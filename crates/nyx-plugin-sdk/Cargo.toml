[package]
name = "nyx-plugin-sdk"
version = "0.1.0"
description = "Write Nyx plugins in Rust: the event loop, view builders, frames, and live system data"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
dbus = ["dep:zbus"]
network = ["dep:zbus"]
bluetooth = ["dep:zbus"]
power = ["dep:zbus"]
mpris = ["dep:zbus"]
audio = []
gtk = ["dep:gtk", "dep:gtk4-layer-shell"]

[dependencies]
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"], optional = true }
gtk4-layer-shell = { version = "0.8", optional = true }
libc = "0.2"
nyx-plugin-protocol = { path = "../nyx-plugin-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"], optional = true }
