[package]
name = "nyx-desktop"
version = "0.1.0"
description = "Shared desktop state for the Nyx desktop apps: Hyprland, workspaces, Omarchy modes, panels"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = { version = "2", optional = true }
gio = { version = "0.22", optional = true }
glib = { version = "0.22", optional = true }

[features]
# `glib` adds the main-loop bridge (`watch_local`) and panel coordination over D-Bus.
# Without it the crate is plain std: a daemon or a test can use the model and watcher.
default = ["glib"]
glib = ["dep:glib", "dep:gio", "dep:async-channel"]

[[example]]
name = "watch"
