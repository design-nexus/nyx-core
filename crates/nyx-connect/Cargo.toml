[package]
name = "nyx-connect"
version = "0.1.0"
description = "Nyx Connect: upstream Flux's fluxd as Nyx's device model (state, events, pairing, access, remembered devices) over its socket, without a daemon of its own"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
nyx-devices = { path = "../nyx-devices" }

[dev-dependencies]
tempfile = "3"
