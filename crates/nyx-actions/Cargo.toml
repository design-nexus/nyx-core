[package]
name = "nyx-actions"
version = "0.1.0"
description = "What Nyx apps can do for other programs: the action contract, its checks, resolution and the registry"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
jsonschema = { version = "0.33", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = { version = "0.3", default-features = false, features = ["alloc"], optional = true }
libc = { version = "0.2", optional = true }
nyx-peer = { path = "../nyx-peer", optional = true }
tokio = { version = "1", features = ["rt", "time", "sync", "macros"], optional = true }
tracing = { version = "0.1", optional = true }
zbus = { version = "5", default-features = false, features = ["tokio"], optional = true }

[features]
# Without `registry`: the contract's types, checks and resolution only (what an app's
# control helper needs). `registry` finds and calls apps over D-Bus; `cli` adds the
# `nyx-actions` command.
default = ["registry"]
registry = ["dep:zbus", "dep:tokio", "dep:futures-util", "dep:tracing"]
cli = ["registry", "dep:libc"]
server = ["registry", "dep:nyx-peer"]

[[bin]]
name = "nyx-actions"
path = "src/bin/nyx-actions.rs"
required-features = ["cli"]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process"] }
