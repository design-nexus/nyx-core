[package]
name = "nyx-eds"
version = "0.1.0"
description = "Evolution Data Server calendars and task lists for Nyx apps"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
glib = "0.22"
gio-sys = "0.22"
glib-sys = "0.22"
gobject-sys = "0.22"
libc = "0.2"
edata_server_sys = { package = "nyx-edataserver-sys", path = "../eds/edataserver-sys", features = ["v3_62"] }
ecal_sys = { package = "nyx-ecal-sys", path = "../eds/ecal-sys", features = ["v3_62_1"] }
ical_glib_sys = { package = "nyx-icalglib-sys", path = "../eds/icalglib-sys", features = ["v4"] }
