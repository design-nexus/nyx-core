[package]
name = "nyx-icalglib-sys"
version = "0.1.0"
description = "FFI bindings to libical-glib 4.0 (generated by gir)"
edition = "2021"
build = "build.rs"

[package.license]
workspace = true

[package.authors]
workspace = true

[package.repository]
workspace = true

[package.metadata.system-deps.libical_glib]
name = "libical-glib"
version = "0"

[package.metadata.system-deps.libical_glib.v1]
version = "1"

[package.metadata.system-deps.libical_glib.v2]
version = "2"

[package.metadata.system-deps.libical_glib.v3]
version = "3"

[package.metadata.system-deps.libical_glib.v3_0_5]
version = "3.0.5"

[package.metadata.system-deps.libical_glib.v3_0_11]
version = "3.0.11"

[package.metadata.system-deps.libical_glib.v3_0_15]
version = "3.0.15"

[package.metadata.system-deps.libical_glib.v3_0_17]
version = "3.0.17"

[package.metadata.system-deps.libical_glib.v3_1]
version = "3.1"

[package.metadata.system-deps.libical_glib.v4]
version = "4"

[package.metadata.docs.rs]
rustdoc-args = ["--generate-link-to-definition"]
all-features = true

[lib]
name = "ical_glib_sys"

[dependencies]
libc = "0.2"
glib-sys = "0.22"
gobject-sys = "0.22"
gio-sys = "0.22"

[build-dependencies]
system-deps = "9"

[dev-dependencies]
shell-words = "1.0.0"
tempfile = "3"

[features]
v1 = []
v2 = ["v1"]
v3 = ["v2"]
v3_0_5 = ["v3"]
v3_0_11 = ["v3_0_5"]
v3_0_15 = ["v3_0_11"]
v3_0_17 = ["v3_0_15"]
v3_1 = ["v3_0_17"]
v4 = ["v3_1"]

[lints.rust]
# Generated code imports every dependency namespace whether it uses it or not.
unused_imports = "allow"
