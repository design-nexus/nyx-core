[package]
name = "nyx-accounts"
version = "0.1.0"
description = "GNOME Online Accounts client for Nyx"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# In-process GOA tokens and passwords, for binaries that sign in themselves.
credentials = []

[dependencies]
anyhow = "1"
gio = "0.22"
glib = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
