[package]
name = "nyx-pim"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
libc = "0.2"
glib = "0.22"
glib-sys = "0.22"
gobject-sys = "0.22"
ical_glib_sys = { package = "nyx-icalglib-sys", path = "../eds/icalglib-sys", features = ["v4"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

nyx-accounts-native = { package = "nyx-accounts-service", git = "https://github.com/design-nexus/nyx-accounts.git", rev = "ecbe31cbfe6688dd5b3d7803c58e433715427c57" }

chrono = "0.4"
url = "2"

reqwest = { version = "0.12", default-features = false }
sha2 = "0.10"

chrono-tz = "0.10"
roxmltree = "0.21"

html2text = "0.17"

vcard-parser = { package = "ical", version = "0.11", default-features = false, features = ["vcard"] }
